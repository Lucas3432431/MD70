# Overlay de desenvolvimento — monta o source code do host sobre /app para
# permitir edição sem rebuild de imagem. NÃO usar em produção.
# Uso: podman-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    volumes:
      - ./backend:/app:ro
      - ./.env.development:/run/secrets/dev.env:ro

  frontend:
    environment:
      - HOT_RELOAD_ENABLED=true
      - FRONTEND_PORT=5182
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:ro
    tmpfs:
      - /app/node_modules/.vite-temp:mode=1777,size=64M
      - /app/node_modules/.vite:mode=1777,size=256M

  analytics:
    volumes:
      - ./analytics/src:/app/src:ro
      - ./analytics/sdk.js.template:/app/sdk.js.template:ro
      - ./analytics/schema.sql:/app/schema.sql:ro
    environment:
      - HOT_RELOAD_ENABLED=true
