# Override de produção — remove volume mounts de source code que ocultam
# os node_modules e o código já buildados dentro das imagens.
services:
  frontend:
    # entrypoint roda `vite build` no start e o nitro apaga/recria /app/.output
    # (tmpfs não serve: ponto de montagem não pode ser removido). Mover o build
    # para a imagem permitiria voltar a read_only.
    read_only: false
    volumes:
      - ./secrets/frontend.secrets:/run/secrets/app.env:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/node_modules/.vite-temp:mode=1777,size=64M
      - /app/node_modules/.vite:mode=1777,size=256M

  backend:
    volumes:
      - ./backend/Data:/app/Data:rw
      - ./backend/Media:/app/Media:rw
      - ./secrets/app.secrets:/run/secrets/app.env:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
