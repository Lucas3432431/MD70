# OPTIONS preflight bypass — must run before all CRS rules.
#
# The nginx server-level modsecurity_rules directive executes AFTER
# modsecurity_rules_file (global CRS rules), so inline rules are too late.
# This file is loaded first by: Include owasp-crs/rules/*.conf (alphabetical,
# 900 < 901), guaranteeing it runs before any CRS inspection.
#
# OPTIONS has no request body — nothing for the WAF to inspect.
# Browsers send it for CORS preflight; blocking it breaks the application.
# Use `allow` (disruptive action) so ModSecurity stops immediately without
# accumulating anomaly score from cookie/header inspection of JWT tokens.

SecRule REQUEST_METHOD "@streq OPTIONS" \
    "id:9001,\
    phase:1,\
    nolog,\
    allow,\
    ctl:ruleEngine=Off,\
    msg:'CORS OPTIONS preflight — bypass WAF inspection'"

# Exclude Mixpanel analytics cookies from MongoDB SQLi detection (CRS 942290,
# 942320, 942370). Mixpanel cookie values contain JSON with keys like
# $device, $in, $initial_referrer which look like MongoDB operators but are
# harmless first-party analytics data set by the browser.
SecRuleUpdateTargetById 942290 "!REQUEST_COOKIES:/^mp_/"
SecRuleUpdateTargetById 942320 "!REQUEST_COOKIES:/^mp_/"
SecRuleUpdateTargetById 942370 "!REQUEST_COOKIES:/^mp_/"

# Rule exclusions previously set via MODSEC_RULE_EXCLUSIONS env var.
# Baked into image so they are not visible at runtime via podman inspect.
SecRuleRemoveById 920350
SecRuleRemoveById 920280
SecRuleRemoveById 920300
SecRuleRemoveById 920420
SecRuleRemoveById 920320
