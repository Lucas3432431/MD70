dbs:
  - path: /home/lucascamargo/Lucas/Apps/MD70/App/mvp/services/backend/Data/Database/MD70.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: ${LITESTREAM_DB_PATH}
