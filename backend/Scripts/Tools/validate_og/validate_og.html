<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Validar OG — Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; min-height: 100vh; padding: 32px 16px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 24px; }

    .form-row {
      display: flex; gap: 8px; margin-bottom: 32px;
    }
    input {
      flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #6366f120; }
    button {
      padding: 10px 20px; background: #6366f1; color: #fff; border: none;
      border-radius: 8px; font-size: 0.95rem; cursor: pointer; white-space: nowrap;
    }
    button:hover { background: #4f46e5; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    /* Card preview */
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

    .card {
      background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 8px #0001; border: 1px solid #e2e8f0;
    }
    .card-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #64748b; padding: 10px 14px 0;
    }

    /* WhatsApp-style */
    .wa-card { background: #fff; border-radius: 8px; overflow: hidden; }
    .wa-image { width: 100%; aspect-ratio: 1.91/1; object-fit: cover; background: #e2e8f0; display: block; }
    .wa-image-placeholder { width: 100%; aspect-ratio: 1.91/1; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.8rem; }
    .wa-body { padding: 10px 12px; border-top: 1px solid #f1f5f9; }
    .wa-domain { font-size: 0.7rem; color: #64748b; margin-bottom: 2px; }
    .wa-title { font-size: 0.9rem; font-weight: 600; color: #0f172a; line-height: 1.3; }
    .wa-desc { font-size: 0.78rem; color: #475569; margin-top: 2px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Telegram-style */
    .tg-card { display: flex; gap: 10px; padding: 12px; }
    .tg-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
    .tg-thumb-placeholder { width: 60px; height: 60px; border-radius: 8px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.65rem; flex-shrink: 0; }
    .tg-body { min-width: 0; }
    .tg-site { font-size: 0.7rem; color: #64748b; margin-bottom: 2px; }
    .tg-title { font-size: 0.88rem; font-weight: 600; color: #0f172a; }
    .tg-desc { font-size: 0.78rem; color: #475569; margin-top: 2px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Twitter/X-style */
    .tw-card { overflow: hidden; }
    .tw-image { width: 100%; aspect-ratio: 2/1; object-fit: cover; background: #e2e8f0; display: block; }
    .tw-image-placeholder { width: 100%; aspect-ratio: 2/1; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.8rem; }
    .tw-body { padding: 10px 14px; }
    .tw-domain { font-size: 0.72rem; color: #64748b; }
    .tw-title { font-size: 0.9rem; font-weight: 700; color: #0f172a; margin-top: 1px; }
    .tw-desc { font-size: 0.8rem; color: #475569; margin-top: 2px; }

    /* Raw HTML */
    .raw { background: #0f172a; padding: 16px; overflow-x: auto; }
    .raw code { font-family: monospace; font-size: 0.78rem; color: #94a3b8; white-space: pre; }

    /* Favicon */
    .favicon-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .favicon-img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; background: #e2e8f0; }
    .favicon-label { font-size: 0.85rem; color: #334155; }

    .error-box {
      background: #fee2e2; border: 1px solid #fca5a5; border-radius: 10px;
      padding: 16px; color: #b91c1c; font-size: 0.9rem;
    }

    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 0.7rem; font-weight: 600; margin-left: 8px;
    }
    .status-ok   { background: #dcfce7; color: #166534; }
    .status-miss { background: #fee2e2; color: #991b1b; }
    .status-warn { background: #fef9c3; color: #854d0e; }
  </style>
</head>
<body>
  <h1>Validar OG Tags — links.domain/:slug</h1>

  <div id="cors-warning" style="display:none;background:#fef9c3;border:1px solid #fcd34d;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:.88rem;color:#78350f">
    <strong>Aberto via file:// — CORS bloqueado.</strong> Sirva o arquivo de um servidor local:<br>
    <code style="background:#fef3c7;padding:4px 8px;border-radius:4px;display:inline-block;margin-top:6px;user-select:all">cd Scripts/Tools &amp;&amp; python3 -m http.server 8090</code>
    <span style="margin:0 8px;color:#92400e">→</span>
    <a href="http://localhost:8090/validate_og.html" style="color:#b45309">http://localhost:8090/validate_og.html</a>
  </div>

  <div class="form-row">
    <input id="slugInput" type="text" placeholder="slug (ex: prox_lanchonete)"
           value="prox_lanchonete" onkeydown="if(event.key==='Enter') fetchOG()">
    <input id="backendInput" type="text" placeholder="App (ex: http://localhost:8081)"
           value="http://localhost:8081" style="max-width:260px">
    <input id="gatewayInput" type="text" placeholder="Gateway links (ex: http://links.localhost:8081)"
           value="http://links.localhost:8081" style="max-width:280px">
    <button id="btn" onclick="fetchOG()">Buscar</button>
  </div>

  <div id="output"></div>

  <script>
    async function fetchOG() {
      const slug    = document.getElementById('slugInput').value.trim();
      const base    = document.getElementById('backendInput').value.trim().replace(/\/$/, '');
      const gateway = document.getElementById('gatewayInput').value.trim().replace(/\/$/, '');
      const btn  = document.getElementById('btn');
      const out  = document.getElementById('output');

      if (!slug) return;

      btn.disabled = true;
      btn.textContent = 'Buscando…';
      out.innerHTML = '';

      const url = `${base}/api/public/og/${encodeURIComponent(slug)}`;

      let rawHtml = '';
      let ok = false;
      let status = 0;
      try {
        const res = await fetch(url, { headers: { 'Accept': 'text/html' } });
        status = res.status;
        rawHtml = await res.text();
        ok = res.ok;
      } catch (e) {
        const isCors = e.message.toLowerCase().includes('cors') || e.message.toLowerCase().includes('failed to fetch') || e.message === 'Load failed';
        if (isCors && window.location.protocol === 'file:') {
          document.getElementById('cors-warning').style.display = 'block';
        }
        out.innerHTML = `<div class="error-box">Erro ao conectar: ${e.message}<br><small>${url}</small></div>`;
        btn.disabled = false; btn.textContent = 'Buscar';
        return;
      }

      if (!ok) {
        const gateway2 = document.getElementById('gatewayInput').value.trim().replace(/\/$/, '');
        out.innerHTML = `
          <div class="error-box" style="margin-bottom:16px">HTTP ${status} — ${escHtml(url)}<br><pre style="margin-top:8px;font-size:.8rem">${escHtml(rawHtml.slice(0,400))}</pre></div>
          <div class="card">
            <div class="card-label" style="padding:14px 14px 8px">Testar via gateway no terminal</div>
            <div style="background:#0f172a;padding:14px 20px;border-radius:0 0 14px 14px">
              <code style="color:#86efac;font-family:monospace;font-size:.78rem;display:block;margin-bottom:8px;user-select:all">curl -s '${base}/api/public/og/${slug}'</code>
              <code style="color:#a5f3fc;font-family:monospace;font-size:.78rem;display:block;user-select:all">curl -sA 'facebookexternalhit/1.1' '${gateway2}/${slug}'</code>
            </div>
          </div>`;
        btn.disabled = false; btn.textContent = 'Buscar';
        return;
      }

      // Parse OG tags from returned HTML
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, 'text/html');

      const og = (prop) => doc.querySelector(`meta[property="${prop}"]`)?.content || '';
      const tw = (name) => doc.querySelector(`meta[name="${name}"]`)?.content || '';
      const meta = (name) => doc.querySelector(`meta[name="${name}"]`)?.content || '';
      const title = doc.querySelector('title')?.textContent || '';

      // Reescreve URLs absolutas de /api/* para o backend local informado no formulário
      // — PUBLIC_URL pode apontar para túnel externo (Cloudflare, ngrok) que muda com restart.
      const localizeImg = (imgUrl) => {
        if (!imgUrl) return imgUrl;
        try {
          const u = new URL(imgUrl);
          if (u.pathname.startsWith('/api/')) return `${base}${u.pathname}${u.search}`;
        } catch {}
        return imgUrl;
      };

      const faviconHref = localizeImg(doc.querySelector('link[rel="icon"]')?.getAttribute('href') || '');
      const ogTitle  = og('og:title')       || title;
      const ogDesc   = og('og:description') || meta('description');
      const ogImage  = localizeImg(og('og:image'));
      const ogUrl    = og('og:url');
      const twImage  = localizeImg(tw('twitter:image'));
      const twCard   = tw('twitter:card');

      const linksUrl = ogUrl || `${gateway}/${slug}`;

      // ── curl commands para testar o gateway ─────────────────────
      const bots = [
        { name: 'WhatsApp',  ua: 'WhatsApp/2.0 (+http://www.whatsapp.com/bot)' },
        { name: 'Telegram',  ua: 'TelegramBot (like TwitterBot)' },
        { name: 'Facebook',  ua: 'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)' },
        { name: 'Discord',   ua: 'Mozilla/5.0 (compatible; Discordbot/2.0; +https://discordapp.com)' },
        { name: 'Slack',     ua: 'Slackbot-LinkExpanding 1.0 (+https://api.slack.com/robots)' },
      ];
      const curlsHtml = bots.map(b =>
        `<div style="margin-bottom:10px">
          <div style="font-size:.72rem;color:#94a3b8;margin-bottom:3px">${b.name}</div>
          <code style="color:#a5f3fc;user-select:all">curl -sA '${b.ua}' '${gateway}/${slug}'</code>
        </div>`
      ).join('');

      const curlDirect = `curl -s '${base}/api/public/og/${slug}'`;


      // Check completeness
      const checks = [
        { label: 'og:title',       val: ogTitle },
        { label: 'og:description', val: ogDesc },
        { label: 'og:image',       val: ogImage },
        { label: 'og:url',         val: ogUrl },
        { label: 'twitter:card',   val: twCard },
        { label: 'favicon',        val: faviconHref },
      ];

      const checksHtml = checks.map(c => {
        const s = c.val
          ? `<span class="status-badge status-ok">✓ presente</span>`
          : `<span class="status-badge status-miss">✗ ausente</span>`;
        return `<tr><td style="padding:4px 10px 4px 0;color:#64748b;font-size:.8rem;">${c.label}</td><td>${s}</td><td style="padding-left:12px;font-size:.78rem;color:#334155;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(c.val||'')}</td></tr>`;
      }).join('');

      const imageHtml = (src, cls, placeholder) =>
        src ? `<img class="${cls}" src="${escHtml(src)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
               <div class="${placeholder}" style="display:none">Imagem não carregou</div>`
            : `<div class="${placeholder}">Sem imagem</div>`;

      out.innerHTML = `
        <!-- Curl commands -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-label" style="padding:14px 14px 8px">Testar via Gateway (bot simulation) <small style="font-weight:400;text-transform:none;letter-spacing:0">— copie e rode no terminal</small></div>
          <div style="background:#0f172a;padding:16px 20px;border-radius:0 0 14px 14px">
            <div style="margin-bottom:14px">
              <div style="font-size:.72rem;color:#94a3b8;margin-bottom:3px">Direto no backend (sem gateway)</div>
              <code style="color:#86efac;font-family:monospace;font-size:.78rem;user-select:all">${escHtml(curlDirect)}</code>
            </div>
            <div style="border-top:1px solid #1e293b;padding-top:14px">
              <div style="font-size:.72rem;color:#94a3b8;margin-bottom:10px">Via gateway (testa bot detection no nginx)</div>
              ${curlsHtml}
            </div>
          </div>
        </div>

        <!-- Checklist -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-label" style="padding:14px 14px 8px">Checklist HTML retornado <small style="font-weight:400;text-transform:none;letter-spacing:0">${url}</small></div>
          <div style="padding:0 14px 14px;overflow-x:auto">
            <table><tbody>${checksHtml}</tbody></table>
          </div>
        </div>

        <!-- Preview grid -->
        <div class="preview-grid">

          <!-- WhatsApp -->
          <div class="card">
            <div class="card-label">WhatsApp / iMessage</div>
            <div style="padding:10px">
              <div class="wa-card" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden">
                ${imageHtml(ogImage,'wa-image','wa-image-placeholder')}
                <div class="wa-body">
                  <div class="wa-domain">${escHtml(linksUrl.replace(/^https?:\/\//,'').split('/')[0])}</div>
                  <div class="wa-title">${escHtml(ogTitle)}</div>
                  <div class="wa-desc">${escHtml(ogDesc)}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Telegram -->
          <div class="card">
            <div class="card-label">Telegram</div>
            <div class="tg-card">
              ${ogImage
                ? `<img class="tg-thumb" src="${escHtml(ogImage)}" onerror="this.style.display='none'"><div class="tg-thumb-placeholder" style="display:none">sem img</div>`
                : `<div class="tg-thumb-placeholder">sem img</div>`}
              <div class="tg-body">
                <div class="tg-site">${escHtml(linksUrl.replace(/^https?:\/\//,'').split('/')[0])}</div>
                <div class="tg-title">${escHtml(ogTitle)}</div>
                <div class="tg-desc">${escHtml(ogDesc)}</div>
              </div>
            </div>
          </div>

          <!-- Twitter/X -->
          <div class="card">
            <div class="card-label">Twitter / X</div>
            <div class="tw-card">
              ${imageHtml(twImage||ogImage,'tw-image','tw-image-placeholder')}
              <div class="tw-body">
                <div class="tw-domain">${escHtml(linksUrl.replace(/^https?:\/\//,'').split('/')[0])}</div>
                <div class="tw-title">${escHtml(ogTitle)}</div>
                <div class="tw-desc">${escHtml(ogDesc)}</div>
              </div>
            </div>
          </div>

          <!-- Favicon -->
          <div class="card">
            <div class="card-label">Favicon</div>
            <div class="favicon-row">
              ${faviconHref
                ? `<img class="favicon-img" src="${escHtml(faviconHref)}" onerror="this.style.display='none'">`
                : '<div class="favicon-img" style="background:#e2e8f0"></div>'}
              <span class="favicon-label">${escHtml(faviconHref || 'Não configurado')}</span>
            </div>
          </div>

          <!-- HTML cru -->
          <div class="card" style="grid-column:1/-1">
            <div class="card-label" style="padding:10px 14px 6px">HTML retornado</div>
            <div class="raw"><code>${escHtml(rawHtml)}</code></div>
          </div>
        </div>
      `;

      btn.disabled = false;
      btn.textContent = 'Buscar';
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // Fetch on load
    fetchOG();
  </script>
</body>
</html>
